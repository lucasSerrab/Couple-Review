# fly.toml app configuration file generated for couple-review on 2026-10-13T17:45:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'couple-review'
primary_region = 'ams'

[build]

[env]
  DATALUG_DATA = '/data'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
